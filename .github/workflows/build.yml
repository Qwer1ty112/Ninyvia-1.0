name: Build Native IPA

on:
push:
branches: [ main ]
workflow_dispatch:

jobs:
build:
runs-on: macos-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Generate Native Xcode Project
    run: |
      mkdir -p App/Sources
      
      cat << 'EOF' > App/Sources/App.swift
      import UIKit
      import WebKit

      @main
      class AppDelegate: UIResponder, UIApplicationDelegate, WKUIDelegate {
          var window: UIWindow?
          func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
              window = UIWindow(frame: UIScreen.main.bounds)
              let vc = UIViewController()
              let web = WKWebView(frame: vc.view.bounds)
              web.autoresizingMask = [.flexibleWidth, .flexibleHeight]
              web.scrollView.bounces = false
              vc.view.addSubview(web)
              if let url = Bundle.main.url(forResource: "index", withExtension: "html") {
                  web.loadFileURL(url, allowingReadAccessTo: url.deletingLastPathComponent())
              }
              window?.rootViewController = vc
              window?.makeKeyAndVisible()
              return true
          }
      }
      EOF

      cat << 'EOF' > App/Info.plist
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
      <plist version="1.0">
      <dict>
          <key>CFBundleExecutable</key><string>MyApp</string>
          <key>CFBundleIdentifier</key><string>com.qwer1ty.app</string>
          <key>CFBundleName</key><string>MyApp</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>LSRequiresIPhoneOS</key><true/>
          <key>UILaunchScreen</key><dict/>
      </dict>
      </plist>
      EOF

  - name: Compile App & Package IPA
    run: |
      mkdir -p Payload/MyApp.app
      cp index.html Payload/MyApp.app/index.html
      cp App/Info.plist Payload/MyApp.app/Info.plist
      
      SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
      swiftc App/Sources/App.swift \
        -target arm64-apple-ios15.0 \
        -sdk "$SDK_PATH" \
        -framework UIKit \
        -framework WebKit \
        -o Payload/MyApp.app/MyApp
        
      chmod +x Payload/MyApp.app/MyApp
      zip -r App.ipa Payload

  - name: Upload IPA Artifact
    uses: actions/upload-artifact@v4
    with:
      name: Ready-IPA
      path: App.ipa

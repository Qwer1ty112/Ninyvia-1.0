name: Build IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install -g cordova
          cordova create app com.qwer1ty112.ninyvia Ninyvia
          cp index.html app/www/index.html
          cd app
          cordova platform add ios
          cordova prepare ios
          xcodebuild -workspace platforms/ios/Ninyvia.xcworkspace -scheme Ninyvia -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          mkdir -p ../Payload
          cp -r build/Build/Products/Release-iphoneos/Ninyvia.app ../Payload/
          cd ..
          zip -r Ninyvia.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Ninyvia-IPA
          path: Ninyvia.ipa

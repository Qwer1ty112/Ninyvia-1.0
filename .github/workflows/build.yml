{"name":"Build IPA","on":["push","workflow_dispatch"],"jobs":{"build":{"runs-on":"macos-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Build","run":"mkdir -p App/Sources Payload/MyApp.app && printf 'import UIKit\nimport WebKit\n@main class AppDelegate:UIResponder,UIApplicationDelegate{var window:UIWindow?;func application(_ a:UIApplication,didFinishLaunchingWithOptions l:[UIApplication.LaunchOptionsKey:Any]?)->Bool{window=UIWindow(frame:UIScreen.main.bounds);let v=UIViewController();let w=WKWebView(frame:v.view.bounds);w.autoresizingMask=[.flexibleWidth,.flexibleHeight];v.view.addSubview(w);if let u=Bundle.main.url(forResource:\"index\",withExtension:\"html\"){w.loadFileURL(u,allowingReadAccessTo:u.deletingLastPathComponent())};window?.rootViewController=v;window?.makeKeyAndVisible();return true}}' > App/Sources/App.swift && printf '<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://apple.com\"><plist version=\"1.0\"><dict><key>CFBundleExecutable</key><string>MyApp</string><key>CFBundleIdentifier</key><string>com.qwer1ty.app</string><key>CFBundleName</key><string>MyApp</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleShortVersionString</key><string>1.0</string><key>CFBundleVersion</key><string>1</string><key>LSRequiresIPhoneOS</key><true/><key>UILaunchScreen</key><dict/></dict></plist>' > App/Info.plist && cp index.html Payload/MyApp.app/index.html && cp App/Info.plist Payload/MyApp.app/Info.plist && swiftc -parse-as-library App/Sources/App.swift -target arm64-apple-ios15.0 -sdk $(xcrun --sdk iphoneos --show-sdk-path) -framework UIKit -framework WebKit -o Payload/MyApp.app/MyApp && chmod +x Payload/MyApp.app/MyApp && zip -r App.ipa Payload"},{"uses":"actions/upload-artifact@v4","with":{"name":"Ready-IPA","path":"App.ipa"}}]}}}

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Virtual JB</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif}
body{background:#0b0c10;color:#fff;height:100vh;overflow:hidden}
#jb{padding:20px;max-width:380px;margin:40px auto;background:#161821;border-radius:18px;border:1px solid #333;text-align:center}
.log{background:#000;color:#30d158;font-family:monospace;font-size:12px;height:140px;padding:10px;border-radius:10px;text-align:left;margin:14px 0}
button{width:100%;padding:13px;border:none;border-radius:12px;font-weight:700;font-size:15px;background:#00f2fe;color:#000}
#rs{display:none;height:100vh;background:#000;justify-content:center;align-items:center;flex-direction:column}
.sp{width:34px;height:34px;border:4px solid #333;border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#os{display:none;height:100vh;background:linear-gradient(135deg,#1d2b64,#f8cdda);padding:24px 16px;flex-direction:column;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;text-align:center;font-size:11px}
.ic{width:54px;height:54px;margin:0 auto 4px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.dock{background:rgba(255,255,255,.25);backdrop-filter:blur(10px);padding:10px;border-radius:22px;display:flex;justify-content:space-around}
#win{display:none;position:fixed;inset:12px;background:#1c1c1e;border-radius:20px;padding:18px;flex-direction:column;justify-content:space-between;border:1px solid #444}
</style>
</head>
<body>
<div id="jb">
<h2>Dopamine Virtual JB</h2>
<div class="log" id="lg">[*] Ready to virtualize /var/jb...</div>
<button onclick="go()">Jailbreak & Respring</button>
</div>
<div id="rs"><div class="sp"></div><p style="margin-top:12px;color:#888;font-size:13px">Respringing...</p></div>
<div id="os">
<div class="grid">
<div onclick="op('Sileo','Repos: Havoc, Chariz, ElleKit\nAll rootless tweaks active!')"><div class="ic" style="background:#00c6ff">📦</div>Sileo</div>
<div onclick="op('Zebra','Zebra 1.1.36 ready.\n0 updates available.')"><div class="ic" style="background:#333">🦓</div>Zebra</div>
<div onclick="op('Filza','/var/jb/Library/MobileSubstrate/DynamicLibraries')"><div class="ic" style="background:#ffd60a">📁</div>Filza</div>
<div onclick="op('NewTerm','mobile@iPhone11 ~ % su\nroot@iPhone11 ~ # _')"><div class="ic" style="background:#000">💻</div>NewTerm</div>
</div>
<div class="dock">
<div class="ic" style="background:#30d158" onclick="op('Phone','Virtual iOS 15.4.1 Environment')">📞</div>
<div class="ic" style="background:#0a84ff" onclick="op('Safari','Rootless WebKit Active')">🧭</div>
<div class="ic" style="background:#ff453a" onclick="location.reload()">🔄</div>
</div>
</div>
<div id="win"><h2 id="wt"></h2><pre id="wb" style="color:#30d158;white-space:pre-wrap;font-size:13px"></pre><button onclick="win.style.display='none'">Home</button></div>
<script>
function go(){lg.innerHTML+="<br>[+] Exploiting kernel...<br>[+] Mounting virtual /var/jb...";setTimeout(()=>{jb.style.display="none";rs.style.display="flex";},800);setTimeout(()=>{rs.style.display="none";os.style.display="flex";},2300);}
function op(t,b){wt.innerText=t;wb.innerText=b;win.style.display="flex";}
</script>
</body>
</html>

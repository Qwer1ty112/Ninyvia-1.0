<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font-family:sans-serif;background:#eef2ff;display:flex;justify-content:center;align-items:center;min-height:100vh}
.b{background:#fff;width:310px;padding:16px;border-radius:18px;text-align:center;box-shadow:0 4px 12px #0002}
input,button{width:100%;box-sizing:border-box;padding:9px;margin:4px 0;border-radius:9px;border:1px solid #cbd5e1;font-size:15px}
button{background:#4f46e5;color:#fff;border:0;font-weight:bold}
.hide{display:none}
.hd,.tr,.lg{width:36px;height:36px;margin:2px auto;border-radius:6px;line-height:36px}
span{display:inline-block;padding:4px 8px;margin:2px;background:#f1f5f9;border-radius:7px}
#ar{position:relative;height:150px;background:#bae6fd;border-radius:12px;overflow:hidden;border-bottom:10px solid #22c55e;margin:8px 0}
#pl{position:absolute;left:30px;bottom:0;width:20px}
#ob{position:absolute;left:300px;bottom:0;width:20px;height:24px;background:#ef4444}
</style></head><body>
<div class="b" id="r"><h2 style="color:#4f46e5;margin:4px">Ninyvia</h2><input id="u" placeholder="Username"><input type="password" id="p" placeholder="Password"><button onclick="if(u.value&&p.value){n.innerText=u.value;r.classList.add('hide');pr.classList.remove('hide')}">Sign up</button></div>
<div class="b hide" id="pr"><h3 id="n" style="margin:4px">User</h3><div id="ht"></div><div class="hd" id="hd" style="background:#fde047">•‿•</div><div class="tr" id="tr" style="background:#4f46e5"></div><div class="lg" id="lg" style="background:#1e3a8a"></div>
<span onclick="hd.style.background='#fde047'">🟡</span><span onclick="hd.style.background='#fed7aa'">🟠</span><span onclick="tr.style.background='#ef4444'">🔴</span><span onclick="tr.style.background='#10b981'">🟢</span><span onclick="ht.innerText='👑'">👑</span><span onclick="ht.innerText='🧢'">🧢</span>
<button style="background:#10b981" onclick="go()">▶ Play Obby</button><button style="background:#ef4444" onclick="pr.classList.add('hide');r.classList.remove('hide')">Log out</button></div>
<div class="b hide" id="gm"><b>Score: <i id="sc">0</i></b><div id="ar" onclick="if(!y)vy=12"><div id="pl"><div id="pht" style="font-size:11px"></div><div id="phd" style="height:14px"></div><div id="ptr" style="height:15px"></div><div id="plg" style="height:14px"></div></div><div id="ob"></div></div><button onclick="if(!y)vy=12">JUMP</button><button style="background:#64748b" onclick="clearInterval(t);gm.classList.add('hide');pr.classList.remove('hide')">Exit</button></div>
<script>
var y=0,vy=0,ox=300,s=0,t;
function go(){pht.innerText=ht.innerText;phd.style.background=hd.style.background;ptr.style.background=tr.style.background;plg.style.background=lg.style.background;pr.classList.add('hide');gm.classList.remove('hide');y=vy=s=0;ox=300;sc.innerText=0;clearInterval(t);t=setInterval(function(){y+=vy;y>0?vy-=1:(y=vy=0);pl.style.bottom=y+'px';ox-=5;if(ox<-20){ox=300;sc.innerText=++s}ob.style.left=ox+'px';if(ox<48&&ox>15&&y<22){alert('Game Over: '+s);go()}},25)}
</script></body></html>
